# Weekly dependency updates, grouped so that one pull request holds related packages.
# A Playwright update must also change the image tags in docs/ci/ and .devcontainer/
# (npm run check fails until they match).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint supports TypeScript < 6.1 only (2026-11). Remove this when it supports a newer major.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      playwright:
        patterns: ['@playwright/*', 'playwright*', '@axe-core/playwright', 'eslint-plugin-playwright']
      reports:
        patterns: ['allure*']
      tooling:
        patterns: ['eslint', 'typescript*', 'prettier', '@types/*']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ['*']
