# UI tests in CI.
#
# - quality:   type check, lint, guards, framework unit tests — on every push and PR,
#              on Linux, Windows and macOS with the minimum and the current Node.js version.
# - framework: the framework's own browser tests against the fixture site of this
#              repository (tests/fixture-app), on Linux and Windows. No internet, no secrets:
#              every push and PR.
# - test:      runs your scenarios when the BASE_URL secret is set (PR: @smoke; main
#              and nightly: everything). Without BASE_URL it is skipped with a notice.
#              Manual runs can also run the reference example (public demo site).
# - report:    merges Allure results.
#
# Evidence policy: CI produces NO screenshots, videos or traces. Only text
# results are uploaded (HTML report, JUnit, JSON, Cucumber, Allure). Rich
# evidence is for local runs (`npm test`, see docs/07-reports-and-debugging.md).
# The configuration forces this when CI is set (src/core/config/env.ts) and each
# job fails if an image, video or trace file is found.
#
# Variables (Settings > Secrets and variables > Actions > Variables):
#   SHARDS  optional list of shard numbers, default [1, 2]. Example for 4 shards: [1, 2, 3, 4]
#
# Secrets (Settings > Secrets and variables > Actions): BASE_URL and test users
# (<ROLE>_USERNAME / <ROLE>_PASSWORD, add each to the env block below).
name: UI tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 2 * * 1-5' # nightly regression, Mon-Fri 02:00 UTC
  workflow_dispatch:
    inputs:
      grep:
        description: 'Tag or scenario filter, e.g. @smoke'
        required: false
        default: ''
      browsers:
        description: 'Browsers, e.g. chromium,firefox,webkit'
        required: false
        default: 'chromium'
      run_example:
        description: 'Also run the reference example (public demo site)'
        type: boolean
        default: false

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The minimum supported version (package.json "engines") and the current LTS.
        node: ['22.18', '24']
    env:
      # The weakening guard compares the change with its base (PR base or previous push).
      GUARD_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD' }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci
      - run: node -e "require('node:fs').copyFileSync('.env.example', '.env')"
      - run: npm run check
      - name: Doctor runs on this system
        # Browsers are not installed in this job, so the doctor may report missing items.
        # The step proves that the doctor itself works on this OS and Node.js version.
        run: node scripts/doctor.mjs --json > doctor.json || node -e "JSON.parse(require('node:fs').readFileSync('doctor.json', 'utf8'))"
        shell: bash

  framework:
    name: Framework browser tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CI: true
      BROWSERS: chromium
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      # The same command a new user runs: packages, .env, browsers, generated tests, doctor.
      - run: npm run setup -- --with-deps
      - run: npm run test:framework
      - name: No images, videos or traces
        if: ${{ !cancelled() }}
        run: node scripts/check-ci-evidence.mjs
      - name: Upload results (text only)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: framework-results-${{ matrix.os }}
          path: |
            reports/junit.xml
            reports/results.json
            reports/cucumber/report.json
          retention-days: 14

  test:
    name: Tests (shard ${{ matrix.shard }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(vars.SHARDS || '[1, 2]') }}
    env:
      CI: true
      BASE_URL: ${{ secrets.BASE_URL }}
      INCLUDE_EXAMPLES: ${{ inputs.run_example && 'true' || 'false' }}
      BROWSERS: ${{ inputs.browsers || 'chromium' }}
      # One filter only: the manual input wins; pull requests run @smoke; other runs run everything.
      GREP: ${{ inputs.grep || (github.event_name == 'pull_request' && '@smoke') || '' }}
      CUSTOMER_USERNAME: ${{ secrets.CUSTOMER_USERNAME }}
      CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
    steps:
      - name: Decide what to run
        id: target
        shell: bash
        run: |
          if [ -n "$BASE_URL" ] || [ "$INCLUDE_EXAMPLES" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::UI tests of your application skipped: set the BASE_URL secret (or run this workflow manually with 'run_example'). The framework browser tests run in the 'framework' job."
          fi
      - uses: actions/checkout@v7
        if: steps.target.outputs.run == 'true'
      - uses: actions/setup-node@v7
        if: steps.target.outputs.run == 'true'
        with: { node-version: 24, cache: npm }
      - if: steps.target.outputs.run == 'true'
        run: npm ci
      - name: Install browsers
        if: steps.target.outputs.run == 'true'
        # Same mobile mapping as scripts/setup.mjs: keep both equal.
        run: npx playwright install --with-deps $(echo "$BROWSERS" | tr ',' ' ' | sed 's/mobile-chrome/chromium/;s/mobile-safari/webkit/')
      - if: steps.target.outputs.run == 'true'
        run: cp .env.example .env && sed -i '/^BASE_URL=/d;/^INCLUDE_EXAMPLES=/d;/^BROWSERS=/d' .env
      - if: steps.target.outputs.run == 'true'
        run: npx bddgen
      - name: Run tests
        if: steps.target.outputs.run == 'true'
        run: |
          if [ -n "$GREP" ]; then
            npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }} --grep "$GREP"
          else
            npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
          fi
      - name: No images, videos or traces
        if: ${{ !cancelled() && steps.target.outputs.run == 'true' }}
        run: node scripts/check-ci-evidence.mjs
      - name: Upload results (text only)
        if: ${{ !cancelled() && steps.target.outputs.run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.shard }}
          path: |
            reports/
            !reports/**/*.png
            !reports/**/*.jpg
            !reports/**/*.jpeg
            !reports/**/*.webm
            !reports/**/*.zip
          retention-days: 14

  report:
    name: Merge reports
    if: ${{ !cancelled() }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with: { path: shards }
      - name: Check for results
        id: results
        run: |
          if ls shards/*/allure-results >/dev/null 2>&1; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v7
        if: steps.results.outputs.found == 'true'
        with: { path: repo }
      - uses: actions/setup-node@v7
        if: steps.results.outputs.found == 'true'
        with: { node-version: 24 }
      - name: Merge Allure results and build the report
        if: steps.results.outputs.found == 'true'
        run: |
          mkdir -p allure-results
          cp -r shards/*/allure-results/* allure-results/ || true
          cd repo && npm ci --ignore-scripts && npx allure generate ../allure-results -o ../allure-report --clean
      - uses: actions/upload-artifact@v7
        if: steps.results.outputs.found == 'true'
        with:
          name: allure-report
          path: allure-report
          retention-days: 30
