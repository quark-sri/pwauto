# UI tests in CI.
#
# - quality: type check, lint, Gherkin generation, skills sync — on every push and PR.
# - test:    runs your scenarios when the BASE_URL secret is set (PR: @smoke; main
#            and nightly: everything). Without BASE_URL it is skipped with a notice.
#            Manual runs can also run the reference example (public demo site).
# - report:  merges Allure results.
#
# Evidence policy: CI produces NO screenshots, videos or traces. Only text
# results are uploaded (HTML report, JUnit, JSON, Cucumber, Allure). Rich
# evidence is for local runs (`npm test`, see docs/07-reports-and-debugging.md).
#
# Secrets (Settings > Secrets and variables > Actions): BASE_URL and test users
# (<ROLE>_USERNAME / <ROLE>_PASSWORD, add each to the env block below).
name: UI tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 2 * * 1-5' # nightly regression, Mon-Fri 02:00 UTC
  workflow_dispatch:
    inputs:
      grep:
        description: 'Tag or scenario filter, e.g. @smoke'
        required: false
        default: ''
      browsers:
        description: 'Browsers, e.g. chromium,firefox,webkit'
        required: false
        default: 'chromium'
      run_example:
        description: 'Also run the reference example (public demo site)'
        type: boolean
        default: false

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type check, lint, Gherkin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The weakening guard compares the change with its base (PR base or previous push).
      GUARD_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD' }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: cp .env.example .env
      - run: npm run check

  test:
    name: Tests (shard ${{ matrix.shard }}/2)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      CI: true
      BASE_URL: ${{ secrets.BASE_URL }}
      INCLUDE_EXAMPLES: ${{ inputs.run_example && 'true' || 'false' }}
      BROWSERS: ${{ inputs.browsers || 'chromium' }}
      # No images or videos in CI: evidence stays local.
      SCREENSHOT: 'off'
      VIDEO: 'off'
      TRACE: 'off'
      STEP_SCREENSHOTS: 'false'
      CUSTOMER_USERNAME: ${{ secrets.CUSTOMER_USERNAME }}
      CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
    steps:
      - name: Decide what to run
        id: target
        run: |
          if [ -n "$BASE_URL" ] || [ "$INCLUDE_EXAMPLES" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::UI tests skipped: set the BASE_URL secret to test your application (or run this workflow manually with 'run_example')."
          fi
      - uses: actions/checkout@v5
        if: steps.target.outputs.run == 'true'
      - uses: actions/setup-node@v5
        if: steps.target.outputs.run == 'true'
        with: { node-version: 24, cache: npm }
      - if: steps.target.outputs.run == 'true'
        run: npm ci
      - name: Install browsers
        if: steps.target.outputs.run == 'true'
        run: npx playwright install --with-deps $(echo "$BROWSERS" | tr ',' ' ' | sed 's/mobile-chrome/chromium/;s/mobile-safari/webkit/')
      - if: steps.target.outputs.run == 'true'
        run: cp .env.example .env && sed -i '/^BASE_URL=/d;/^INCLUDE_EXAMPLES=/d;/^BROWSERS=/d' .env
      - if: steps.target.outputs.run == 'true'
        run: npx bddgen
      - name: Run tests
        if: steps.target.outputs.run == 'true'
        run: npx playwright test --shard=${{ matrix.shard }}/2 ${{ inputs.grep && format('--grep "{0}"', inputs.grep) || '' }} ${{ github.event_name == 'pull_request' && '--grep @smoke' || '' }}
      - name: Upload results (text only)
        if: ${{ !cancelled() && steps.target.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.shard }}
          path: |
            reports/
            !reports/**/*.png
            !reports/**/*.jpg
            !reports/**/*.jpeg
            !reports/**/*.webm
            !reports/**/*.zip
          retention-days: 14

  report:
    name: Merge reports
    if: ${{ !cancelled() }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with: { path: shards }
      - name: Check for results
        id: results
        run: |
          if ls shards/*/allure-results >/dev/null 2>&1; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v5
        if: steps.results.outputs.found == 'true'
        with: { path: repo }
      - uses: actions/setup-node@v5
        if: steps.results.outputs.found == 'true'
        with: { node-version: 24 }
      - name: Merge Allure results and build the report
        if: steps.results.outputs.found == 'true'
        run: |
          mkdir -p allure-results
          cp -r shards/*/allure-results/* allure-results/ || true
          cd repo && npm ci --ignore-scripts && npx allure generate ../allure-results -o ../allure-report --clean
      - uses: actions/upload-artifact@v4
        if: steps.results.outputs.found == 'true'
        with:
          name: allure-report
          path: allure-report
          retention-days: 30
