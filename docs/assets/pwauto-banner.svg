<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">pwauto</title>
  <desc id="desc">pwauto: AI-agent-ready UI test automation for any web application. The workflow has four steps in a loop: Explore, Design, Automate, Heal and Report.</desc>

  <defs>
    <!-- Background gradient: midnight blue, violet, electric cyan -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.45" stop-color="#0b1240"/>
      <stop offset="1" stop-color="#160a3a"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d946ef" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>

    <!-- The colored light blobs. The page uses them once as the background
         and again, blurred, inside each glass card (frosted-glass effect). -->
    <g id="blobs">
      <ellipse cx="210" cy="150" rx="360" ry="280" fill="url(#glowViolet)"/>
      <ellipse cx="1090" cy="120" rx="380" ry="260" fill="url(#glowCyan)"/>
      <ellipse cx="660" cy="560" rx="460" ry="220" fill="url(#glowBlue)"/>
      <ellipse cx="1120" cy="560" rx="260" ry="200" fill="url(#glowPink)"/>
      <ellipse cx="120" cy="560" rx="240" ry="180" fill="url(#glowCyan)" opacity="0.6"/>
    </g>

    <filter id="frost" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="8" in="SourceAlpha" result="a"/>
      <feFlood flood-color="#a5f3fc" flood-opacity="0.55"/>
      <feComposite operator="in" in2="a" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="18"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Glass surface: light fill at the top, darker at the bottom -->
    <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <!-- Glass edge: bright top-left, faint bottom-right -->
    <linearGradient id="glassEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#a5f3fc" stop-opacity="0.45"/>
    </linearGradient>
    <!-- Specular highlight band across the top of a card -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Data stream colors -->
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="streamBack" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="sphere" cx="0.35" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Card shapes -->
    <clipPath id="clipHeader"><rect x="240" y="56" width="800" height="210" rx="34"/></clipPath>
    <clipPath id="clip1"><rect x="90" y="356" width="230" height="160" rx="26"/></clipPath>
    <clipPath id="clip2"><rect x="380" y="356" width="230" height="160" rx="26"/></clipPath>
    <clipPath id="clip3"><rect x="670" y="356" width="230" height="160" rx="26"/></clipPath>
    <clipPath id="clip4"><rect x="960" y="356" width="230" height="160" rx="26"/></clipPath>

    <!-- Paths of the workflow loop (also used for the moving light spheres) -->
    <path id="flow1" d="M320 436 C345 436 355 436 380 436"/>
    <path id="flow2" d="M610 436 C635 436 645 436 670 436"/>
    <path id="flow3" d="M900 436 C925 436 935 436 960 436"/>
    <path id="loopBack" d="M1075 516 C1075 600 1000 604 640 604 C280 604 205 600 205 516"/>
    <path id="fromHeader" d="M640 266 C640 310 205 300 205 356"/>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <use href="#blobs" xlink:href="#blobs"/>
  <!-- Fine grid for depth -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 80H1280M0 160H1280M0 240H1280M0 320H1280M0 400H1280M0 480H1280M0 560H1280"/>
    <path d="M80 0V640M160 0V640M240 0V640M320 0V640M400 0V640M480 0V640M560 0V640M640 0V640M720 0V640M800 0V640M880 0V640M960 0V640M1040 0V640M1120 0V640M1200 0V640"/>
  </g>
  <!-- Small floating light points -->
  <g fill="#ffffff">
    <circle cx="96" cy="70" r="1.6" opacity="0.6"/>
    <circle cx="1180" cy="300" r="1.4" opacity="0.5"/>
    <circle cx="1010" cy="40" r="1.2" opacity="0.7"/>
    <circle cx="180" cy="300" r="1.2" opacity="0.5"/>
    <circle cx="1230" cy="620" r="1.6" opacity="0.4"/>
    <circle cx="40" cy="420" r="1.3" opacity="0.5"/>
    <circle cx="1100" cy="250" r="1" opacity="0.6"/>
  </g>

  <!-- Data streams: header to the first step, between the steps, and the loop back -->
  <g fill="none" stroke-linecap="round" filter="url(#softGlow)">
    <use href="#fromHeader" xlink:href="#fromHeader" stroke="#22d3ee" stroke-width="2" stroke-opacity="0.55" stroke-dasharray="2 8"/>
    <use href="#flow1" xlink:href="#flow1" stroke="url(#stream)" stroke-width="3"/>
    <use href="#flow2" xlink:href="#flow2" stroke="url(#stream)" stroke-width="3"/>
    <use href="#flow3" xlink:href="#flow3" stroke="url(#stream)" stroke-width="3"/>
    <use href="#loopBack" xlink:href="#loopBack" stroke="url(#streamBack)" stroke-width="2.5" stroke-opacity="0.8" stroke-dasharray="10 8"/>
  </g>
  <!-- Arrow heads -->
  <g fill="#c4b5fd" filter="url(#softGlow)">
    <path d="M372 430 L382 436 L372 442 Z"/>
    <path d="M662 430 L672 436 L662 442 Z"/>
    <path d="M952 430 L962 436 L952 442 Z"/>
    <path d="M199 524 L205 514 L211 524 Z" fill="#22d3ee"/>
  </g>
  <text x="640" y="626" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="3" fill="#a5f3fc" fill-opacity="0.75">LEARN FROM EACH RUN · REPEAT</text>

  <!-- Moving light spheres along the streams -->
  <g>
    <circle r="5" fill="url(#sphere)"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#flow1" xlink:href="#flow1"/></animateMotion></circle>
    <circle r="5" fill="url(#sphere)"><animateMotion dur="1.6s" begin="0.5s" repeatCount="indefinite"><mpath href="#flow2" xlink:href="#flow2"/></animateMotion></circle>
    <circle r="5" fill="url(#sphere)"><animateMotion dur="1.6s" begin="1s" repeatCount="indefinite"><mpath href="#flow3" xlink:href="#flow3"/></animateMotion></circle>
    <circle r="6" fill="url(#sphere)"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#loopBack" xlink:href="#loopBack"/></animateMotion></circle>
    <circle r="6" fill="url(#sphere)"><animateMotion dur="6s" begin="3s" repeatCount="indefinite"><mpath href="#loopBack" xlink:href="#loopBack"/></animateMotion></circle>
    <circle r="5" fill="url(#sphere)"><animateMotion dur="3s" repeatCount="indefinite"><mpath href="#fromHeader" xlink:href="#fromHeader"/></animateMotion></circle>
  </g>

  <!-- ===== Header card ===== -->
  <g filter="url(#shadow)">
    <g clip-path="url(#clipHeader)">
      <rect width="1280" height="640" fill="url(#bg)"/>
      <use href="#blobs" xlink:href="#blobs" filter="url(#frost)"/>
      <rect x="240" y="56" width="800" height="210" fill="url(#glassFill)"/>
      <rect x="240" y="56" width="800" height="70" fill="url(#sheen)"/>
      <!-- Caustic light inside the glass -->
      <ellipse cx="900" cy="250" rx="220" ry="40" fill="#22d3ee" opacity="0.12" filter="url(#frost)"/>
      <ellipse cx="360" cy="70" rx="200" ry="30" fill="#ffffff" opacity="0.10" filter="url(#frost)"/>
    </g>
    <rect x="240.75" y="56.75" width="798.5" height="208.5" rx="33.5" fill="none" stroke="url(#glassEdge)" stroke-width="1.5"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="640" y="160" font-size="86" font-weight="700" letter-spacing="-2" fill="#ffffff" filter="url(#textGlow)">pwauto</text>
    <text x="640" y="204" font-size="24" font-weight="500" fill="#e0f2fe" fill-opacity="0.92">AI-agent-ready UI test automation for any web application</text>
    <text x="640" y="240" font-size="15" font-weight="500" letter-spacing="2" fill="#a5f3fc" fill-opacity="0.85">PLAYWRIGHT · TYPESCRIPT · BDD (GHERKIN) · CLAUDE CODE · CODEX</text>
  </g>

  <!-- ===== Step cards ===== -->
  <!-- Shared glass body for one card: background copy, fill, sheen, edge -->
  <g filter="url(#shadow)">
    <g clip-path="url(#clip1)">
      <rect width="1280" height="640" fill="url(#bg)"/><use href="#blobs" xlink:href="#blobs" filter="url(#frost)"/>
      <rect x="90" y="356" width="230" height="160" fill="url(#glassFill)"/><rect x="90" y="356" width="230" height="56" fill="url(#sheen)"/>
    </g>
    <rect x="90.75" y="356.75" width="228.5" height="158.5" rx="25.5" fill="none" stroke="url(#glassEdge)" stroke-width="1.5"/>
  </g>
  <g filter="url(#shadow)">
    <g clip-path="url(#clip2)">
      <rect width="1280" height="640" fill="url(#bg)"/><use href="#blobs" xlink:href="#blobs" filter="url(#frost)"/>
      <rect x="380" y="356" width="230" height="160" fill="url(#glassFill)"/><rect x="380" y="356" width="230" height="56" fill="url(#sheen)"/>
    </g>
    <rect x="380.75" y="356.75" width="228.5" height="158.5" rx="25.5" fill="none" stroke="url(#glassEdge)" stroke-width="1.5"/>
  </g>
  <g filter="url(#shadow)">
    <g clip-path="url(#clip3)">
      <rect width="1280" height="640" fill="url(#bg)"/><use href="#blobs" xlink:href="#blobs" filter="url(#frost)"/>
      <rect x="670" y="356" width="230" height="160" fill="url(#glassFill)"/><rect x="670" y="356" width="230" height="56" fill="url(#sheen)"/>
    </g>
    <rect x="670.75" y="356.75" width="228.5" height="158.5" rx="25.5" fill="none" stroke="url(#glassEdge)" stroke-width="1.5"/>
  </g>
  <g filter="url(#shadow)">
    <g clip-path="url(#clip4)">
      <rect width="1280" height="640" fill="url(#bg)"/><use href="#blobs" xlink:href="#blobs" filter="url(#frost)"/>
      <rect x="960" y="356" width="230" height="160" fill="url(#glassFill)"/><rect x="960" y="356" width="230" height="56" fill="url(#sheen)"/>
    </g>
    <rect x="960.75" y="356.75" width="228.5" height="158.5" rx="25.5" fill="none" stroke="url(#glassEdge)" stroke-width="1.5"/>
  </g>

  <!-- Step badges (number) -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">
    <circle cx="122" cy="388" r="15" fill="url(#badge)" filter="url(#softGlow)"/><text x="122" y="393">1</text>
    <circle cx="412" cy="388" r="15" fill="url(#badge)" filter="url(#softGlow)"/><text x="412" y="393">2</text>
    <circle cx="702" cy="388" r="15" fill="url(#badge)" filter="url(#softGlow)"/><text x="702" y="393">3</text>
    <circle cx="992" cy="388" r="15" fill="url(#badge)" filter="url(#softGlow)"/><text x="992" y="393">4</text>
  </g>

  <!-- Step icons (top right of each card) -->
  <g fill="none" stroke="#a5f3fc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
    <!-- 1 Explore: magnifier -->
    <circle cx="284" cy="384" r="9"/><path d="M291 391 L299 399"/>
    <!-- 2 Design: document with lines -->
    <path d="M566 374 H582 L590 382 V402 H566 Z"/><path d="M572 388 H584 M572 395 H580"/>
    <!-- 3 Automate: code brackets with play -->
    <path d="M854 378 L846 388 L854 398 M872 378 L880 388 L872 398"/><path d="M860 382 L868 388 L860 394 Z" fill="#a5f3fc"/>
    <!-- 4 Heal & Report: bar chart with check -->
    <path d="M1136 402 H1168"/><path d="M1140 402 V392 M1148 402 V384 M1156 402 V388"/><path d="M1158 380 L1162 384 L1170 374"/>
  </g>

  <!-- Step text -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <g font-size="25" font-weight="700" fill="#ffffff">
      <text x="112" y="446">Explore</text>
      <text x="402" y="446">Design</text>
      <text x="692" y="446">Automate</text>
      <text x="982" y="446">Heal &amp; Report</text>
    </g>
    <g font-size="14.5" fill="#dbeafe" fill-opacity="0.85">
      <text x="112" y="474">Learn the app. Build</text>
      <text x="112" y="494">the knowledge base.</text>
      <text x="402" y="474">Write BDD scenarios.</text>
      <text x="402" y="494">A person approves them.</text>
      <text x="692" y="474">Page objects and steps.</text>
      <text x="692" y="494">Run until stable.</text>
      <text x="982" y="474">Fix test bugs. Report</text>
      <text x="982" y="494">app bugs and results.</text>
    </g>
  </g>
</svg>
