<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">pwauto</title>
  <desc id="desc">pwauto: AI-agent-ready UI test automation for any web application. Workflow: 1 Explore the app into a knowledge base, 2 write BDD scenarios, a person approves them, 3 automate them with Playwright, 4 heal failures and report. Tests pass for the right reason, and every run keeps evidence.</desc>

  <style>
    /* Stop the moving lights for readers who ask for less motion */
    @media (prefers-reduced-motion: reduce) { .mover { display: none; } }
  </style>

  <defs>
    <!-- Background gradient: midnight blue, violet, electric cyan -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.45" stop-color="#0b1240"/>
      <stop offset="1" stop-color="#160a3a"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <!-- Colored light blobs. Used once as the background and again,
         blurred, inside each glass card (frosted-glass effect). -->
    <g id="blobs">
      <ellipse cx="210" cy="150" rx="360" ry="280" fill="url(#glowViolet)"/>
      <ellipse cx="1090" cy="120" rx="380" ry="260" fill="url(#glowCyan)"/>
      <ellipse cx="660" cy="560" rx="460" ry="220" fill="url(#glowBlue)"/>
      <ellipse cx="1120" cy="560" rx="260" ry="200" fill="url(#glowPink)"/>
      <ellipse cx="120" cy="560" rx="240" ry="180" fill="url(#glowCyan)" opacity="0.6"/>
    </g>

    <filter id="frost" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="8" in="SourceAlpha" result="a"/>
      <feFlood flood-color="#a5f3fc" flood-opacity="0.55"/>
      <feComposite operator="in" in2="a" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="18"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#a5f3fc" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="streamBack" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="sphere" cx="0.35" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="approve" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>

    <!-- Card shapes: header 240..1040 x 44..244; steps 236 x 170 at y 318 -->
    <clipPath id="clipHeader"><rect x="240" y="44" width="800" height="200" rx="34"/></clipPath>
    <clipPath id="clip1"><rect x="90" y="318" width="236" height="170" rx="26"/></clipPath>
    <clipPath id="clip2"><rect x="378" y="318" width="236" height="170" rx="26"/></clipPath>
    <clipPath id="clip3"><rect x="666" y="318" width="236" height="170" rx="26"/></clipPath>
    <clipPath id="clip4"><rect x="954" y="318" width="236" height="170" rx="26"/></clipPath>
    <clipPath id="clipApprove"><rect x="546" y="526" width="188" height="42" rx="21"/></clipPath>

    <!-- Paths of the workflow (also used by the moving light spheres) -->
    <path id="flow1" d="M326 403 H378"/>
    <path id="flow2" d="M614 403 H666"/>
    <path id="flow3" d="M902 403 H954"/>
    <path id="loopBack" d="M1072 488 C1072 576 1040 598 968 598 M312 598 C240 598 208 576 208 488"/>
    <path id="loopBackMotion" d="M1072 488 C1072 586 1010 598 640 598 C270 598 208 586 208 488"/>
    <path id="gate" d="M640 403 V526"/>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <use href="#blobs" xlink:href="#blobs"/>
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 80H1280M0 160H1280M0 240H1280M0 320H1280M0 400H1280M0 480H1280M0 560H1280"/>
    <path d="M80 0V640M160 0V640M240 0V640M320 0V640M400 0V640M480 0V640M560 0V640M640 0V640M720 0V640M800 0V640M880 0V640M960 0V640M1040 0V640M1120 0V640M1200 0V640"/>
  </g>
  <g fill="#ffffff">
    <circle cx="96" cy="70" r="1.6" opacity="0.6"/>
    <circle cx="1180" cy="290" r="1.4" opacity="0.5"/>
    <circle cx="1010" cy="24" r="1.2" opacity="0.7"/>
    <circle cx="160" cy="280" r="1.2" opacity="0.5"/>
    <circle cx="1240" cy="620" r="1.6" opacity="0.4"/>
    <circle cx="40" cy="420" r="1.3" opacity="0.5"/>
  </g>

  <!-- Data streams -->
  <g fill="none" stroke-linecap="round" filter="url(#softGlow)">
    <use href="#flow1" xlink:href="#flow1" stroke="url(#stream)" stroke-width="3"/>
    <use href="#flow2" xlink:href="#flow2" stroke="url(#stream)" stroke-width="3"/>
    <use href="#flow3" xlink:href="#flow3" stroke="url(#stream)" stroke-width="3"/>
    <use href="#gate" xlink:href="#gate" stroke="#34d399" stroke-width="2" stroke-opacity="0.8" stroke-dasharray="3 6"/>
    <use href="#loopBack" xlink:href="#loopBack" stroke="url(#streamBack)" stroke-width="2.5" stroke-opacity="0.8" stroke-dasharray="10 8"/>
  </g>
  <g fill="#c4b5fd" filter="url(#softGlow)">
    <path d="M369 397 L379 403 L369 409 Z"/>
    <path d="M657 397 L667 403 L657 409 Z"/>
    <path d="M945 397 L955 403 L945 409 Z"/>
    <path d="M202 497 L208 487 L214 497 Z" fill="#22d3ee"/>
  </g>
  <!-- Approval gate dot on the stream between Scenarios and Automate -->
  <circle cx="640" cy="403" r="6" fill="#34d399" filter="url(#softGlow)"/>

  <!-- Moving light spheres -->
  <g class="mover">
    <circle r="5" fill="url(#sphere)"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#flow1" xlink:href="#flow1"/></animateMotion></circle>
    <circle r="5" fill="url(#sphere)"><animateMotion dur="1.6s" begin="0.5s" repeatCount="indefinite"><mpath href="#flow2" xlink:href="#flow2"/></animateMotion></circle>
    <circle r="5" fill="url(#sphere)"><animateMotion dur="1.6s" begin="1s" repeatCount="indefinite"><mpath href="#flow3" xlink:href="#flow3"/></animateMotion></circle>
    <circle r="6" fill="url(#sphere)"><animateMotion dur="7s" repeatCount="indefinite"><mpath href="#loopBackMotion" xlink:href="#loopBackMotion"/></animateMotion></circle>
  </g>

  <!-- ===== Header card ===== -->
  <g filter="url(#shadow)">
    <g clip-path="url(#clipHeader)">
      <rect width="1280" height="640" fill="url(#bg)"/>
      <use href="#blobs" xlink:href="#blobs" filter="url(#frost)"/>
      <rect x="240" y="44" width="800" height="200" fill="url(#glassFill)"/>
      <rect x="240" y="44" width="800" height="66" fill="url(#sheen)"/>
      <ellipse cx="900" cy="236" rx="220" ry="40" fill="#22d3ee" opacity="0.12" filter="url(#frost)"/>
    </g>
    <rect x="240.75" y="44.75" width="798.5" height="198.5" rx="33.5" fill="none" stroke="url(#glassEdge)" stroke-width="1.5"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="640" y="140" font-size="88" font-weight="700" letter-spacing="-2" fill="#ffffff" filter="url(#textGlow)">pwauto</text>
    <text x="640" y="184" font-size="28" font-weight="500" fill="#e0f2fe">UI test automation with AI agents</text>
    <text x="640" y="222" font-size="19" font-weight="600" letter-spacing="1.5" fill="#a5f3fc">Playwright · TypeScript · BDD · Claude Code · Codex</text>
  </g>

  <!-- ===== Step cards ===== -->
  <g filter="url(#shadow)">
    <g clip-path="url(#clip1)">
      <rect width="1280" height="640" fill="url(#bg)"/><use href="#blobs" xlink:href="#blobs" filter="url(#frost)"/>
      <rect x="90" y="318" width="236" height="170" fill="url(#glassFill)"/><rect x="90" y="318" width="236" height="56" fill="url(#sheen)"/>
    </g>
    <rect x="90.75" y="318.75" width="234.5" height="168.5" rx="25.5" fill="none" stroke="url(#glassEdge)" stroke-width="1.5"/>
  </g>
  <g filter="url(#shadow)">
    <g clip-path="url(#clip2)">
      <rect width="1280" height="640" fill="url(#bg)"/><use href="#blobs" xlink:href="#blobs" filter="url(#frost)"/>
      <rect x="378" y="318" width="236" height="170" fill="url(#glassFill)"/><rect x="378" y="318" width="236" height="56" fill="url(#sheen)"/>
    </g>
    <rect x="378.75" y="318.75" width="234.5" height="168.5" rx="25.5" fill="none" stroke="url(#glassEdge)" stroke-width="1.5"/>
  </g>
  <g filter="url(#shadow)">
    <g clip-path="url(#clip3)">
      <rect width="1280" height="640" fill="url(#bg)"/><use href="#blobs" xlink:href="#blobs" filter="url(#frost)"/>
      <rect x="666" y="318" width="236" height="170" fill="url(#glassFill)"/><rect x="666" y="318" width="236" height="56" fill="url(#sheen)"/>
    </g>
    <rect x="666.75" y="318.75" width="234.5" height="168.5" rx="25.5" fill="none" stroke="url(#glassEdge)" stroke-width="1.5"/>
  </g>
  <g filter="url(#shadow)">
    <g clip-path="url(#clip4)">
      <rect width="1280" height="640" fill="url(#bg)"/><use href="#blobs" xlink:href="#blobs" filter="url(#frost)"/>
      <rect x="954" y="318" width="236" height="170" fill="url(#glassFill)"/><rect x="954" y="318" width="236" height="56" fill="url(#sheen)"/>
    </g>
    <rect x="954.75" y="318.75" width="234.5" height="168.5" rx="25.5" fill="none" stroke="url(#glassEdge)" stroke-width="1.5"/>
  </g>

  <!-- "You approve" checkpoint chip (human in the loop) -->
  <g filter="url(#shadow)">
    <g clip-path="url(#clipApprove)">
      <rect width="1280" height="640" fill="url(#bg)"/><use href="#blobs" xlink:href="#blobs" filter="url(#frost)"/>
      <rect x="546" y="526" width="188" height="42" fill="#34d399" fill-opacity="0.16"/>
    </g>
    <rect x="546.75" y="526.75" width="186.5" height="40.5" rx="20.25" fill="none" stroke="#6ee7b7" stroke-opacity="0.8" stroke-width="1.5"/>
  </g>
  <g fill="none" stroke="#6ee7b7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="574" cy="540" r="5"/><path d="M564 558 C564 549 584 549 584 558"/>
    <path d="M589 547 L593 551 L601 542"/>
  </g>
  <text x="664" y="554" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#d1fae5">You approve</text>

  <!-- Step badges -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">
    <circle cx="124" cy="352" r="17" fill="url(#badge)" filter="url(#softGlow)"/><text x="124" y="358">1</text>
    <circle cx="412" cy="352" r="17" fill="url(#badge)" filter="url(#softGlow)"/><text x="412" y="358">2</text>
    <circle cx="700" cy="352" r="17" fill="url(#badge)" filter="url(#softGlow)"/><text x="700" y="358">3</text>
    <circle cx="988" cy="352" r="17" fill="url(#badge)" filter="url(#softGlow)"/><text x="988" y="358">4</text>
  </g>

  <!-- Step icons -->
  <g fill="none" stroke="#a5f3fc" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
    <!-- 1 Explore: magnifier -->
    <circle cx="286" cy="347" r="10"/><path d="M294 355 L302 363"/>
    <!-- 2 Scenarios: document with lines -->
    <path d="M568 336 H584 L592 344 V366 H568 Z"/><path d="M574 350 H586 M574 357 H582"/>
    <!-- 3 Automate: code brackets with play -->
    <path d="M854 340 L846 351 L854 362 M874 340 L882 351 L874 362"/><path d="M861 345 L869 351 L861 357 Z" fill="#a5f3fc"/>
    <!-- 4 Heal & Report: bar chart with check -->
    <path d="M1132 366 H1166"/><path d="M1137 366 V355 M1145 366 V346 M1153 366 V350"/><path d="M1155 342 L1159 346 L1168 335" stroke="#6ee7b7"/>
  </g>

  <!-- Step text: short, large enough to read on a phone -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <g font-size="30" font-weight="700" fill="#ffffff">
      <text x="112" y="420">Explore</text>
      <text x="400" y="420">Scenarios</text>
      <text x="688" y="420">Automate</text>
      <text x="976" y="420">Heal &amp; Report</text>
    </g>
    <g font-size="19" fill="#dbeafe">
      <text x="112" y="458">Learn the app</text>
      <text x="688" y="458">With Playwright</text>
      <text x="976" y="458">Fix, then report</text>
    </g>
    <text x="400" y="458" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="600" fill="#67e8f9">Given · When · Then</text>
  </g>

  <!-- Loop label: what keeps the tests honest -->
  <text x="640" y="604" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="1.2" fill="#a5f3fc">TESTS PASS FOR THE RIGHT REASON · EVIDENCE ON EVERY RUN</text>
</svg>
