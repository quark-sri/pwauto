# pwauto pipeline for GitLab CI. Copy to .gitlab-ci.yml in your repository root.
# NOT run by the pwauto project's own CI: check it in your GitLab before you rely on it.
#
# CI/CD variables (Settings > CI/CD > Variables, masked): BASE_URL, and per role
# <ROLE>_USERNAME / <ROLE>_PASSWORD.
# Evidence policy: text results only. CI=true is set by GitLab; pwauto then keeps
# screenshots, videos and traces off.

stages: [check, test]

default:
  # Keep the version equal to @playwright/test in package.json.
  image: mcr.microsoft.com/playwright:v1.65.0-noble
  cache:
    key: { files: [package-lock.json] }
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline
    - cp .env.example .env

check:
  stage: check
  script:
    - npm run check

ui-tests:
  stage: test
  parallel: 2
  rules:
    - if: $BASE_URL
  script:
    - npx bddgen
    # Merge requests run @smoke; other pipelines run everything.
    - |
      if [ -n "$CI_MERGE_REQUEST_IID" ]; then
        npx playwright test --shard=$CI_NODE_INDEX/$CI_NODE_TOTAL --grep @smoke
      else
        npx playwright test --shard=$CI_NODE_INDEX/$CI_NODE_TOTAL
      fi
  after_script:
    - node scripts/check-ci-evidence.mjs
  artifacts:
    when: always
    expire_in: 14 days
    paths: [reports/]
    reports:
      junit: reports/junit.xml
